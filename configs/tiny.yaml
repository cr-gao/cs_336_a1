tokenizer:
  vocab_size: 10000
  special_tokens: ["<|endoftext|>"]
  vocab_file: "output/vocab_tinystories.pkl"
  merge_file: "output/merges_tinystories.pkl"
  readable_vocab_file: "output/readable_vocab_tinystories.json"
  readable_merge_file: "output/readable_merges_tinystories.json"

model:
  vocab_size: 10000
  context_size: 256

  num_layers: 6
  d_model: 384
  num_heads: 6
  d_ff: 1536
  use_rope: true

optimizer:
  learning_rate: 3e-4
  weight_decay: 0.1

  beta1: 0.9
  beta2: 0.95
  eps: 1e-8

scheduler:
  warmup_steps: 100
  min_lr: 3e-5
  max_lr: 3e-4

training:
  batch_size: 32
  max_steps: 10000
  grad_clip: 1.0

data:
  dataset_path: "data/tinystories_sample_5M.txt"
  train_path: "output/encoded_tinystories_sample_5M_train.npy"
  val_path: "output/encoded_tinystories_sample_5M_val.npy"
  num_workers: 4

system:
  seed: 42
  device: cuda
  dtype: bf16

logging:
  log_every: 100
  eval_every: 500
  eval_iters: 50

checkpoint:
  save_dir: checkpoints
  save_every: 1000